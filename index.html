<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Agenda Pro</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a2e" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-32.png">
<!-- OneSignal -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
:root{
  --p:#1a1a2e; --a:#e94560; --a2:#ff6b6b;
  --bg:#f0f2f5; --card:#fff; --text:#1a1a2e;
  --muted:#64748b; --border:#e2e8f0;
  --r:14px; --rs:8px; --sh:0 2px 16px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* ── LOADING ── */
#splash{position:fixed;inset:0;background:var(--p);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
.sp-logo{width:80px;height:80px;border-radius:22px;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#fff;margin-bottom:20px;letter-spacing:-1px}
.sp-name{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
.sp-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:32px}
.sp-bar{width:160px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.sp-fill{height:100%;background:var(--a);border-radius:2px;animation:fill 1.2s ease forwards}
@keyframes fill{from{width:0}to{width:100%}}

/* ── AUTH ── */
#auth{position:fixed;inset:0;background:linear-gradient(160deg,var(--p),#16213e);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:24px}
.auth-logo{width:68px;height:68px;border-radius:20px;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;margin-bottom:18px}
.auth-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;text-align:center}
.auth-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:28px;text-align:center}
.auth-box{background:#fff;border-radius:var(--r);padding:24px;width:100%;max-width:340px}
.auth-box h3{font-size:15px;font-weight:700;margin-bottom:18px;color:var(--text)}
.auth-err{font-size:12px;color:#ef4444;margin-bottom:12px;display:none;padding:8px 12px;background:#fef2f2;border-radius:6px}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:15px;font-family:'Inter',sans-serif;color:var(--text);margin-bottom:12px;transition:border-color .2s}
.fi:focus{outline:none;border-color:var(--a)}
.ab{width:100%;padding:14px;background:var(--a);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
.ab:hover{opacity:.9}

/* ── HEADER ── */
#header{background:var(--p);color:#fff;flex-shrink:0;display:none}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.brand{display:flex;align-items:center;gap:10px}
.b-logo{width:36px;height:36px;border-radius:10px;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden}
.b-logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.b-name{font-size:15px;font-weight:700;letter-spacing:-.3px}
.b-sub{font-size:11px;opacity:.5;margin-top:1px;display:flex;align-items:center;gap:4px}
.sync{width:6px;height:6px;border-radius:50%;background:#10b981;display:inline-block;transition:background .3s}
.sync.s{background:#f59e0b;animation:blink 1s infinite}
.sync.e{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hbtns{display:flex;gap:8px}
.hbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.hbtn:hover{background:rgba(255,255,255,.2)}

/* ── NAV TABS ── */
.ntabs{display:flex;background:rgba(0,0,0,.25);margin:0 18px 14px;border-radius:10px;padding:3px;gap:2px}
.ntab{flex:1;padding:7px 4px;border:none;border-radius:8px;background:transparent;color:rgba(255,255,255,.5);font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.ntab i{font-size:15px}
.ntab.on{background:#fff;color:var(--p)}

/* ── TOOLBAR ── */
#toolbar{display:none;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.tl-label{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tl-nav{display:flex;gap:6px}
.arr{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.arr:hover{border-color:var(--a);color:var(--a)}
.hoy-btn{padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif}
.hoy-btn:hover{border-color:var(--a);color:var(--a)}

/* ── SCROLL ── */
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}

/* ── VISTAS ── */
.vista{display:none;padding:12px 14px 80px}
.vista.on{display:block}

/* ── MES ── */
.dn-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dn{text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cc{background:var(--card);border-radius:var(--rs);min-height:70px;padding:5px;border:1.5px solid transparent;transition:border-color .15s;overflow:hidden;position:relative}
.cc.om{background:#f8fafc;opacity:.5}
.cc.hoy{border-color:var(--a)!important}
.cc.has{cursor:pointer}
.cc.has:active{transform:scale(.97)}
.cn{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
.hoy .cn span{background:var(--a);color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.edot{width:100%;font-size:8px;font-weight:700;padding:2px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.emore{font-size:9px;color:var(--muted)}

/* ── SEMANA ── */
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wc{background:var(--card);border-radius:var(--rs);padding:7px 5px;min-height:180px}
.wc.hc{border:1.5px solid var(--a)}
.wcn{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;letter-spacing:.05em;margin-bottom:2px}
.wcnum{font-size:15px;font-weight:700;text-align:center;color:var(--text);margin-bottom:7px}
.wc.hc .wcnum{color:var(--a)}
.wev{font-size:8.5px;font-weight:600;padding:3px 4px;border-radius:4px;margin-bottom:2px;cursor:pointer;line-height:1.3}

/* ── LISTA ── */
.lsearch{display:flex;gap:8px;margin-bottom:14px}
.lsearch input,.lsearch select{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:13px;font-family:'Inter',sans-serif;background:var(--card);color:var(--text)}
.lsearch input{flex:1}
.lsearch input:focus,.lsearch select:focus{outline:none;border-color:var(--a)}
.ev-item{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sh);border-left:4px solid var(--a)}
.ev-item.past{border-left-color:#cbd5e1;opacity:.65}
.ev-badge{flex-shrink:0;background:var(--p);color:#fff;border-radius:10px;padding:8px 10px;text-align:center;min-width:48px}
.ev-badge .d{font-size:20px;font-weight:700;line-height:1}
.ev-badge .m{font-size:9px;text-transform:uppercase;opacity:.6;margin-top:1px}
.ev-inf{flex:1;min-width:0;cursor:pointer}
.ev-tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.ev-tit{font-size:14px;font-weight:700}
.ev-cat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.ev-desc{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:4px}
.ev-meta{display:flex;gap:10px;flex-wrap:wrap}
.ev-meta span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.ev-acts{display:flex;gap:6px;flex-shrink:0}
.eab{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.eab:hover{border-color:var(--a);color:var(--a)}
.eab.del:hover{border-color:#ef4444;color:#ef4444}

/* ── FAB ── */
#fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:18px;background:var(--a);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 6px 20px rgba(233,69,96,.4);display:none;align-items:center;justify-content:center;z-index:100;transition:transform .15s}
#fab:active{transform:scale(.9)}

/* ── OVERLAY ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;animation:up .25s ease;padding-bottom:env(safe-area-inset-bottom,16px)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.mh-t{font-size:16px;font-weight:700}
.mx{width:32px;height:32px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mb{padding:20px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:'Inter',sans-serif;background:var(--card);color:var(--text)}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--a)}
.fg textarea{resize:vertical;min-height:75px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{padding:0 20px 16px;display:flex;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer}
.btn-p{background:var(--a);color:#fff}
.btn-s{background:var(--bg);color:var(--muted)}

/* ── DETALLE ── */
.det-h{background:var(--p);border-radius:20px 20px 0 0;padding:20px 20px 24px;color:#fff}
.det-cat{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.15);margin-bottom:10px}
.det-tit{font-size:20px;font-weight:700;line-height:1.3}
.det-body{padding:20px}
.det-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.det-row:last-child{border-bottom:none}
.det-ico{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);flex-shrink:0}
.det-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.det-val{font-size:14px;color:var(--text);margin-top:2px}

/* ── CONFIG ── */
.cfg-section{margin-bottom:22px}
.cfg-section h3{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-radius:var(--rs);margin-bottom:8px;box-shadow:var(--sh)}
.cfg-row label{font-size:14px;color:var(--text)}
.cfg-row input[type=color]{width:40px;height:30px;border:none;cursor:pointer;border-radius:6px}
.cfg-row input[type=text]{width:190px;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:'Inter',sans-serif;color:var(--text);background:var(--bg)}
.cfg-row input:focus{outline:none;border-color:var(--a)}
.notif-btn{width:100%;padding:12px;background:var(--a);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}

/* ── CATEGORÍAS COLORES ── */
.cat-Reunión,.cat-Meeting{background:#dbeafe;color:#1e40af}
.cat-Turno,.cat-Cita{background:#d1fae5;color:#065f46}
.cat-Vencimiento,.cat-Deadline{background:#fee2e2;color:#991b1b}
.cat-Tarea{background:#fef3c7;color:#92400e}
.cat-Capacitación{background:#ede9fe;color:#4c1d95}
.cat-Cumpleaños{background:#fce7f3;color:#9d174d}
.cat-Otro{background:#f1f5f9;color:#475569}

/* ── NOTIF BANNER ── */
.notif-bar{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--rs);padding:10px 14px;margin-bottom:14px;font-size:12px;color:#856404;display:flex;align-items:center;gap:8px;cursor:pointer}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty i{font-size:44px;display:block;margin-bottom:12px;opacity:.3}
.empty p{font-size:14px}

/* ── TOAST ── */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--p);color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── DÍA MODAL ── */
.handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-logo" id="spLogo">Ap</div>
  <div class="sp-name" id="spName">Agenda Pro</div>
  <div class="sp-sub" id="spSub">Calendario profesional</div>
  <div class="sp-bar"><div class="sp-fill"></div></div>
</div>

<!-- AUTH -->
<div id="auth">
  <div class="auth-logo" id="authLogo">Ap</div>
  <div class="auth-title" id="authTitle">Agenda Pro</div>
  <div class="auth-sub">Iniciá sesión para continuar</div>
  <div class="auth-box">
    <h3>Iniciar sesión</h3>
    <div class="auth-err" id="authErr"></div>
    <input class="fi" type="email" id="authEmail" placeholder="Email" autocomplete="email">
    <input class="fi" type="password" id="authPass" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="ab" onclick="login()" id="loginBtn">Entrar</button>
  </div>
</div>

<!-- HEADER -->
<div id="header">
  <div class="hdr">
    <div class="brand">
      <div class="b-logo" id="bLogo">Ap</div>
      <div>
        <div class="b-name" id="bName">Agenda Pro</div>
        <div class="b-sub" id="bSub">Calendario <span class="sync" id="sync"></span></div>
      </div>
    </div>
    <div class="hbtns">
      <button class="hbtn" onclick="openExport()" title="Exportar PDF"><i class="ti ti-file-export"></i></button>
      <button class="hbtn" onclick="openCfg()" title="Configuración"><i class="ti ti-settings"></i></button>
      <button class="hbtn" onclick="logout()" title="Salir"><i class="ti ti-logout"></i></button>
    </div>
  </div>
  <div class="ntabs">
    <button class="ntab on" onclick="setVista('mes')" id="tab-mes"><i class="ti ti-calendar-month"></i> Mes</button>
    <button class="ntab" onclick="setVista('semana')" id="tab-semana"><i class="ti ti-calendar-week"></i> Semana</button>
    <button class="ntab" onclick="setVista('lista')" id="tab-lista"><i class="ti ti-list"></i> Lista</button>
  </div>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <div class="tl-nav">
    <button class="arr" onclick="navPrev()"><i class="ti ti-chevron-left"></i></button>
    <button class="arr" onclick="navNext()"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="tl-label" id="tlLabel"></div>
  <button class="hoy-btn" onclick="goHoy()">Hoy</button>
</div>

<!-- SCROLL AREA -->
<div id="scroll">
  <!-- MES -->
  <div class="vista on" id="v-mes">
    <div class="dn-row" id="dnRow"></div>
    <div class="cal" id="calGrid"></div>
  </div>
  <!-- SEMANA -->
  <div class="vista" id="v-semana">
    <div class="wgrid" id="weekGrid"></div>
  </div>
  <!-- LISTA -->
  <div class="vista" id="v-lista">
    <div class="lsearch">
      <input type="text" id="searchIn" placeholder="Buscar..." oninput="renderLista()">
      <select id="catFil" onchange="renderLista()"><option value="">Todas</option></select>
    </div>
    <div id="notifBar" class="notif-bar" onclick="pedirPermiso()" style="display:none">
      <i class="ti ti-bell" style="font-size:16px;flex-shrink:0"></i>
      <span>Activar notificaciones para recibir recordatorios</span>
    </div>
    <div id="listaEl"></div>
  </div>
</div>

<!-- FAB -->
<button id="fab" onclick="openNuevo()"><i class="ti ti-plus"></i></button>

<!-- MODAL EVENTO -->
<div class="ov" id="ovEvento">
  <div class="modal">
    <div class="handle"></div>
    <div class="mh">
      <div class="mh-t" id="evTit">Nuevo evento</div>
      <button class="mx" onclick="closeOv('ovEvento')"><i class="ti ti-x"></i></button>
    </div>
    <div class="mb">
      <div class="fg"><label>Título *</label><input type="text" id="evTitle" placeholder="Nombre del evento"></div>
      <div class="frow">
        <div class="fg"><label>Fecha *</label><input type="date" id="evFecha"></div>
        <div class="fg"><label>Hora</label><input type="time" id="evHora"></div>
      </div>
      <div class="frow">
        <div class="fg"><label>Categoría</label><select id="evCat"></select></div>
        <div class="fg"><label>Duración</label>
          <select id="evDur">
            <option value="">Sin duración</option>
            <option value="15">15 min</option><option value="30">30 min</option>
            <option value="60">1 hora</option><option value="90">1.5 hs</option>
            <option value="120">2 horas</option>
          </select>
        </div>
      </div>
      <div class="fg"><label>Lugar</label><input type="text" id="evLugar" placeholder="Dirección, Zoom..."></div>
      <div class="fg"><label>Notas</label><textarea id="evDesc" placeholder="Detalles..."></textarea></div>
      <div class="fg"><label>Recordatorio</label>
        <select id="evRec">
          <option value="">Sin recordatorio</option>
          <option value="5">5 minutos antes</option>
          <option value="15">15 minutos antes</option>
          <option value="30">30 minutos antes</option>
          <option value="60">1 hora antes</option>
          <option value="1440">1 día antes</option>
        </select>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-s" onclick="closeOv('ovEvento')">Cancelar</button>
      <button class="btn btn-p" onclick="guardarEv()" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="ov" id="ovDetalle">
  <div class="modal">
    <div class="handle"></div>
    <div class="det-h" id="detH" style="background:var(--p)">

// ═══════════════════════════════════════════════
//  INDEXEDDB — local-first
// ═══════════════════════════════════════════════
let _idb = null;
function openIDB(){
  return new Promise((res,rej)=>{
    if(_idb){ res(_idb); return; }
    const r = indexedDB.open('agenda_v3', 1);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('ev')){
        const s = db.createObjectStore('ev',{keyPath:'id'});
        s.createIndex('uid','user_id'); s.createIndex('fecha','fecha');
      }
      if(!db.objectStoreNames.contains('cfg')) db.createObjectStore('cfg',{keyPath:'uid'});
    };
    r.onsuccess = e => { _idb = e.target.result; res(_idb); };
    r.onerror   = e => rej(e.target.error);
  });
}

async function idbGetAll(store, idx, val){
  const db = await openIDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly');
    const req = idx ? tx.objectStore(store).index(idx).getAll(val) : tx.objectStore(store).getAll();
    req.onsuccess = ()=>res(req.result||[]);
    req.onerror   = ()=>rej(req.error);
  });
}
async function idbPut(store, obj){
  const db = await openIDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(obj).onsuccess = ()=>res();
  });
}
async function idbDel(store, key){
  const db = await openIDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key).onsuccess = ()=>res();
  });
}
async function idbGet(store, key){
  const db = await openIDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = ()=>res(req.result||null);
    req.onerror   = ()=>rej(req.error);
  });
}

// ═══════════════════════════════════════════════
//  SYNC CLOUD — background, no bloquea UI
// ═══════════════════════════════════════════════
async function syncFromCloud(){
  setSyncDot('s');
  try{
    // Sync config
    const {data:cfg} = await sb.from('config').select('*').eq('user_id',USER.id).single();
    if(cfg){
      const c={nombre:cfg.nombre,sub:cfg.sub,color1:cfg.color1,color2:cfg.color2,cats:cfg.cats,uid:USER.id};
      CFG={...CFG,...c}; await idbPut('cfg',c); aplicarTema();
    }
    // Sync eventos
    const {data:evs} = await sb.from('eventos').select('*').eq('user_id',USER.id);
    if(evs){
      // Actualizar IDB con datos de la nube
      for(const e of evs) await idbPut('cfg_ev_tmp', dbToLocal(e)).catch(()=>{});
      // Reemplazar todos
      const db = await openIDB();
      await new Promise(res=>{
        const tx = db.transaction('ev','readwrite');
        tx.objectStore('ev').clear().onsuccess = async()=>{
          for(const e of evs) tx.objectStore('ev').put(dbToLocal(e));
          tx.oncomplete = res;
        };
      });
      EVTS = evs.map(dbToLocal);
      render();
    }
    setSyncDot('ok');
  }catch(e){ setSyncDot('e'); }
}

async function syncToCloud(ev, op='upsert'){
  // Fire & forget — no esperar
  if(op==='upsert'){
    sb.from('eventos').upsert(localToDB(ev),{onConflict:'id'}).then(({error})=>{
      if(error) console.log('sync error:',error);
      else setSyncDot('ok');
    });
  } else {
    sb.from('eventos').delete().eq('id',ev).eq('user_id',USER.id).then(()=>setSyncDot('ok'));
  }
}

function localToDB(ev){
  return {
    id:ev.id, user_id:USER.id, titulo:ev.titulo, fecha:ev.fecha,
    hora:ev.hora||null, cat:ev.cat||'Otro',
    duracion:ev.duracion?parseInt(ev.duracion):null,
    lugar:ev.lugar||null, descripcion:ev.desc||null,
    recordatorio:ev.recordatorio?parseInt(ev.recordatorio):null
  };
}
function dbToLocal(r){
  return {
    id:r.id, user_id:r.user_id, titulo:r.titulo, fecha:r.fecha,
    hora:r.hora?r.hora.slice(0,5):'', cat:r.cat||'Otro',
    duracion:r.duracion?String(r.duracion):'',
    lugar:r.lugar||'', desc:r.descripcion||'',
    recordatorio:r.recordatorio?String(r.recordatorio):''
  };
}

function setSyncDot(s){

//  RENDER

function render(){
  if(vista==='mes') renderMes();
  else if(vista==='semana') renderSemana();
  else renderLista();

function renderMes(){
  document.getElementById('tlLabel').textContent=MESES[mes]+' '+anio;
  document.getElementById('dnRow').innerHTML=DIAS.map(d=>`<div class="dn">${d}</div>`).join('');
  const hoy=new Date(); const pri=new Date(anio,mes,1);
  let dow=pri.getDay(); dow=dow===0?6:dow-1;
  const tot=new Date(anio,mes+1,0).getDate();
  let html='';
  for(let i=0;i<dow;i++) html+=celdaHTML(new Date(anio,mes,-dow+i+1),true);
  for(let d=1;d<=tot;d++) html+=celdaHTML(new Date(anio,mes,d),false);
  const r=(dow+tot)%7===0?0:7-(dow+tot)%7;
  for(let i=1;i<=r;i++) html+=celdaHTML(new Date(anio,mes+1,i),true);
  document.getElementById('calGrid').innerHTML=html;
}

function celdaHTML(f,om){
  const iso=toISO(f); const hoy=new Date(); const esH=sameDay(f,hoy);
  const evs=EVTS.filter(e=>e.fecha===iso).sort((a,b)=>(a.hora||'zz').localeCompare(b.hora||'zz'));
  let cls='cc'+(om?' om':'')+(esH?' hoy':'')+(evs.length?' has':'');
  const num=esH?`<div class="cn"><span>${f.getDate()}</span></div>`:`<div class="cn">${f.getDate()}</div>`;
  const chips=evs.slice(0,2).map(e=>`<div class="edot cat-${e.cat||'Otro'}" onclick="event.stopPropagation();verDet('${e.id}')">${e.hora?e.hora+' ':''}${e.titulo}</div>`).join('');
  const mas=evs.length>2?`<div class="emore">+${evs.length-2} más</div>`:'';
  return `<div class="${cls}" onclick="${evs.length||!om?`abrirDia('${iso}')`:''}">${num}${chips}${mas}</div>`;
}

function renderSemana(){
  const ini=new Date(semIni); const fin=new Date(ini); fin.setDate(ini.getDate()+6);
  document.getElementById('tlLabel').textContent=`${ini.getDate()} ${MESES[ini.getMonth()].slice(0,3)} — ${fin.getDate()} ${MESES[fin.getMonth()].slice(0,3)} ${fin.getFullYear()}`;
  const hoy=new Date(); let html='';
  for(let i=0;i<7;i++){
    const d=new Date(ini); d.setDate(ini.getDate()+i);
    const iso=toISO(d); const esH=sameDay(d,hoy);
    const evs=EVTS.filter(e=>e.fecha===iso).sort((a,b)=>(a.hora||'zz').localeCompare(b.hora||'zz'));
    html+=`<div class="wc${esH?' hc':''}">
      <div class="wcn">${DIAS[i]}</div>
      <div class="wcnum">${d.getDate()}</div>
      ${evs.map(e=>`<div class="wev cat-${e.cat||'Otro'}" onclick="verDet('${e.id}')">${e.hora?e.hora+' ':''}${e.titulo}</div>`).join('')}
    </div>`;
  }
  document.getElementById('weekGrid').innerHTML=html;
}

function renderLista(){
  const q=(document.getElementById('searchIn').value||'').toLowerCase();
  const cat=document.getElementById('catFil').value;
  const hoy=toISO(new Date());
  let evs=EVTS.filter(e=>(!q||e.titulo.toLowerCase().includes(q)||(e.desc||'').toLowerCase().includes(q)))
    .filter(e=>!cat||e.cat===cat)
    .sort((a,b)=>a.fecha===b.fecha?(a.hora||'zz').localeCompare(b.hora||'zz'):a.fecha.localeCompare(b.fecha));

  // Banner notif
  const nb=document.getElementById('notifBar');
  if(nb) nb.style.display='Notification' in window && Notification.permission==='default'?'flex':'none';

  if(!evs.length){
    document.getElementById('listaEl').innerHTML=`<div class="empty"><i class="ti ti-calendar-off"></i><p>${q||cat?'Sin resultados':'No hay eventos. ¡Agregá el primero!'}</p></div>`;
    return;
  }
  const grupos={};
  evs.forEach(e=>{if(!grupos[e.fecha])grupos[e.fecha]=[];grupos[e.fecha].push(e);});
  let html='';
  Object.keys(grupos).sort().forEach(fecha=>{
    const d=new Date(fecha+'T12:00:00'); const esH=fecha===hoy; const pas=fecha<hoy;
    html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px${pas?';opacity:.5':''}">
      ${esH?'<span style="color:var(--a)">● HOY — </span>':''}${DIAS[(d.getDay()||7)-1]}, ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}
    </div>`;
    grupos[fecha].forEach(e=>{
      html+=`<div class="ev-item${pas?' past':''}">
        <div class="ev-badge"><div class="d">${d.getDate()}</div><div class="m">${MESES[d.getMonth()].slice(0,3)}</div></div>
        <div class="ev-inf" onclick="verDet('${e.id}')">
          <div class="ev-tr"><span class="ev-tit">${e.titulo}</span><span class="ev-cat cat-${e.cat||'Otro'}">${e.cat||'Otro'}</span>${e.recordatorio?'<i class="ti ti-bell" style="font-size:11px;color:var(--a)"></i>':''}</div>
          ${e.desc?`<div class="ev-desc">${e.desc}</div>`:''}
          <div class="ev-meta">
            ${e.hora?`<span><i class="ti ti-clock"></i>${e.hora}${e.duracion?' ('+e.duracion+' min)':''}</span>`:''}
            ${e.lugar?`<span><i class="ti ti-map-pin"></i>${e.lugar}</span>`:''}
          </div>
        </div>
        <div class="ev-acts">
          <button class="eab" onclick="editarEv('${e.id}')"><i class="ti ti-edit"></i></button>
          <button class="eab del" onclick="eliminarEv('${e.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    });
  });
  document.getElementById('listaEl').innerHTML=html;
}

async function guardarEv(){
  const titulo=document.getElementById('evTitle').value.trim();
  if(!titulo){ showToast('Ingresá un título'); return; }
  const fecha=document.getElementById('evFecha').value;
  if(!fecha){ showToast('Elegí una fecha'); return; }
  const btn=document.getElementById('btnGuardar');
  if(btn.disabled) return;
  btn.disabled=true;

  const ev={
    id: editId||crypto.randomUUID(),
    user_id: USER.id,
    titulo, fecha,
    hora: document.getElementById('evHora').value,
    cat: document.getElementById('evCat').value,
    duracion: document.getElementById('evDur').value,
    lugar: document.getElementById('evLugar').value.trim(),
    desc: document.getElementById('evDesc').value.trim(),
    recordatorio: document.getElementById('evRec').value
  };

  // 1. Guardar en IndexedDB INMEDIATO
  await idbPut('ev', ev);
  if(editId){ const i=EVTS.findIndex(e=>e.id===editId); if(i>=0) EVTS[i]=ev; }
  else EVTS.push(ev);

  // 2. Cerrar modal y actualizar UI sin esperar red
  closeOv('ovEvento');
  render();
  showToast(editId?'✅ Evento actualizado':'✅ Evento guardado');

  // 3. Sync cloud en background
  syncToCloud(ev, 'upsert');
}

async function editarEv(id){
  const ev=EVTS.find(e=>e.id===id); if(!ev) return;
  editId=id;
  document.getElementById('evTit').textContent='Editar evento';
  document.getElementById('evTitle').value=ev.titulo;
  document.getElementById('evFecha').value=ev.fecha;
  document.getElementById('evHora').value=ev.hora||'';
  document.getElementById('evCat').value=ev.cat||'';
  document.getElementById('evDur').value=ev.duracion||'';
  document.getElementById('evLugar').value=ev.lugar||'';
  document.getElementById('evDesc').value=ev.desc||'';
  document.getElementById('evRec').value=ev.recordatorio||'';
  document.getElementById('btnGuardar').disabled=false;
  document.getElementById('btnGuardar').textContent='Guardar';
  ['ovDetalle','ovDia'].forEach(id=>closeOv(id));
  document.getElementById('ovEvento').classList.add('on');
}

async function eliminarEv(id){
  if(!confirm('¿Eliminar este evento?')) return;
  // Inmediato
  await idbDel('ev', id);
  EVTS=EVTS.filter(e=>e.id!==id);
  closeOv('ovDetalle'); closeOv('ovDia');
  render();
  showToast('🗑️ Evento eliminado');
  // Cloud
  syncToCloud(id, 'delete');
}

// ═══════════════════════════════════════════════
//  DETALLE
// ═══════════════════════════════════════════════
function verDet(id){
  const ev=EVTS.find(e=>e.id===id); if(!ev) return;
  detId=id;
  const d=new Date(ev.fecha+'T12:00:00');
  document.getElementById('detH').style.background=CFG.color1;
  document.getElementById('detCat').textContent=ev.cat||'Otro';
  document.getElementById('detTit').textContent=ev.titulo;
  let r='';
  r+=dr('ti-calendar','Fecha',`${DIAS[(d.getDay()||7)-1]}, ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}`);
  if(ev.hora) r+=dr('ti-clock','Hora',ev.hora+(ev.duracion?' — '+ev.duracion+' min':''));
  if(ev.lugar) r+=dr('ti-map-pin','Lugar',ev.lugar);
  if(ev.desc) r+=dr('ti-notes','Notas',ev.desc);
  if(ev.recordatorio) r+=dr('ti-bell','Recordatorio',ev.recordatorio+' min antes');
  document.getElementById('detBody').innerHTML=r;
  document.getElementById('ovDetalle').classList.add('on');
}
function dr(ico,lbl,val){
  return `<div class="det-row"><div class="det-ico"><i class="ti ${ico}"></i></div><div><div class="det-label">${lbl}</div><div class="det-val">${val}</div></div></div>`;
}
function editarDet(){ if(detId) editarEv(detId); }

// ═══════════════════════════════════════════════
//  DÍA
// ═══════════════════════════════════════════════
function abrirDia(iso){
  diaISO=iso;
  const d=new Date(iso+'T12:00:00');
  document.getElementById('diaTit').textContent=`${DIAS[(d.getDay()||7)-1]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
  const evs=EVTS.filter(e=>e.fecha===iso).sort((a,b)=>(a.hora||'zz').localeCompare(b.hora||'zz'));
  if(!evs.length){
    document.getElementById('diaBody').innerHTML=`<div class="empty"><i class="ti ti-calendar-off"></i><p>Sin eventos este día</p></div>`;
  } else {
    document.getElementById('diaBody').innerHTML=evs.map(e=>`
      <div class="ev-item" style="margin-bottom:10px;cursor:pointer" onclick="closeOv('ovDia');verDet('${e.id}')">
        <div class="ev-inf">
          <div class="ev-tr"><span class="ev-tit">${e.titulo}</span><span class="ev-cat cat-${e.cat||'Otro'}">${e.cat||'Otro'}</span></div>
          ${e.hora?`<div class="ev-meta"><span><i class="ti ti-clock"></i>${e.hora}</span>${e.lugar?`<span><i class="ti ti-map-pin"></i>${e.lugar}</span>`:''}</div>`:''}
        </div>
        <div class="ev-acts">
          <button class="eab" onclick="event.stopPropagation();closeOv('ovDia');editarEv('${e.id}')"><i class="ti ti-edit"></i></button>
          <button class="eab del" onclick="event.stopPropagation();eliminarEv('${e.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`).join('');
  }
  document.getElementById('ovDia').classList.add('on');
}

// ═══════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════
function openCfg(){
  document.getElementById('cfgNom').value=CFG.nombre;
  document.getElementById('cfgSub').value=CFG.sub;
  document.getElementById('cfgC1').value=CFG.color1;
  document.getElementById('cfgC2').value=CFG.color2;
  document.getElementById('cfgCats').value=CFG.cats;
  document.getElementById('notifSt').textContent='Notification' in window?Notification.permission:'No soportado';
  document.getElementById('cfgEmail').textContent=USER?.email||'';
  document.getElementById('ovCfg').classList.add('on');
}

function previewCfg(){
  CFG.nombre=document.getElementById('cfgNom').value||'Agenda Pro';
  CFG.sub=document.getElementById('cfgSub').value||'Calendario';
  CFG.color1=document.getElementById('cfgC1').value;
  CFG.color2=document.getElementById('cfgC2').value;
  CFG.cats=document.getElementById('cfgCats').value||'Reunión,Otro';
  aplicarTema();
}

async function guardarCfg(){
  previewCfg();
  // Guardar local
  await idbPut('cfg',{...CFG,uid:USER.id});
  // Cloud background
  sb.from('config').upsert({
    user_id:USER.id, nombre:CFG.nombre, sub:CFG.sub,
    color1:CFG.color1, color2:CFG.color2, cats:CFG.cats
  },{onConflict:'user_id'});
  closeOv('ovCfg');
  render();
  showToast('✅ Configuración guardada');
}

// ═══════════════════════════════════════════════
//  EXPORT PDF
// ═══════════════════════════════════════════════
function openExport(){ document.getElementById('ovExport').classList.add('on'); }
function toggleExpF(){ document.getElementById('expF').style.display=document.getElementById('expRng').value==='custom'?'block':'none'; }

function genPDF(){
  const rng=document.getElementById('expRng').value;
  const hoy=new Date(); let evs,tit,sub;
  if(rng==='mes'){
    const d1=toISO(new Date(anio,mes,1)),d2=toISO(new Date(anio,mes+1,0));
    evs=EVTS.filter(e=>e.fecha>=d1&&e.fecha<=d2); tit=MESES[mes]+' '+anio; sub='Agenda del mes';
  } else if(rng==='semana'){
    const d1=toISO(semIni),fd=new Date(semIni);fd.setDate(semIni.getDate()+6);const d2=toISO(fd);
    evs=EVTS.filter(e=>e.fecha>=d1&&e.fecha<=d2); tit='Semana'; sub='Agenda semanal';
  } else {
    const d=document.getElementById('expD').value,h=document.getElementById('expH').value;
    if(!d||!h){showToast('Completá fechas');return;}
    evs=EVTS.filter(e=>e.fecha>=d&&e.fecha<=h); tit='Personalizado'; sub='Agenda';
  }
  evs=evs.sort((a,b)=>a.fecha===b.fecha?(a.hora||'zz').localeCompare(b.hora||'zz'):a.fecha.localeCompare(b.fecha));
  if(!evs.length){showToast('Sin eventos en ese rango');return;}
  const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const [r1,g1,b1]=hrgb(CFG.color1); const [r2,g2,b2]=hrgb(CFG.color2);
  doc.setFillColor(r1,g1,b1);doc.rect(0,0,210,32,'F');
  doc.setFillColor(r2,g2,b2);doc.rect(0,28,210,4,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);
  doc.text(CFG.nombre.toUpperCase(),14,13);
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text(sub+' — '+tit,14,20);
  doc.text('Generado: '+hoy.toLocaleDateString('es-AR')+'  |  Eventos: '+evs.length,14,26);
  doc.autoTable({
    startY:38,margin:{left:14,right:14},
    head:[['Fecha','Hora','Cat.','Evento','Lugar','Notas']],
    body:evs.map(e=>{const d=new Date(e.fecha+'T12:00:00');return[d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(),e.hora||'—',e.cat||'—',e.titulo,e.lugar||'—',e.desc||'—'];}),
    theme:'striped',headStyles:{fillColor:[r1,g1,b1],textColor:255,fontSize:8,fontStyle:'bold'},
    styles:{fontSize:8,cellPadding:2.5,valign:'top'},alternateRowStyles:{fillColor:[245,248,252]},
  });
  const pg=doc.internal.getNumberOfPages();
  for(let p=1;p<=pg;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(160,160,160);doc.text(CFG.nombre+' | Pág. '+p+' de '+pg,105,290,{align:'center'});}
  doc.save(CFG.nombre.replace(/\s+/g,'_')+'_'+tit+'.pdf');
  closeOv('ovExport'); showToast('📄 PDF generado');
}
function hrgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function lunes(d){const c=new Date(d);const dw=c.getDay();c.setDate(c.getDate()-(dw===0?6:dw-1));c.setHours(0,0,0,0);return c;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}

// Cerrar overlay al tocar fondo
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('on');}));

// Service Worker
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

// OneSignal init
window.OneSignalDeferred = window.OneSignalDeferred || [];
</script>
